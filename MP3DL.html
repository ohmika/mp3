<!DOCTYPE html>
<html>
<head>
  <title>MP3 Downloader</title>
</head>
<body>
  <script>
    async function getLink() {
      const videoUrl = prompt("YouTube URL:");
      if (!videoUrl) return;

      const response = await fetch(`https://youtube-mp310.p.rapidapi.com/download/mp3?url=${encodeURIComponent(videoUrl)}`, {
        method: 'GET',
        headers: {
          'x-rapidapi-key': '53b56eb16bmsh31053a7c717de97p196b40jsn71422a475df0',
          'x-rapidapi-host': 'youtube-mp310.p.rapidapi.com'
        }
      });

      const data = await response.json();
      if (data.downloadUrl) {
        window.location.href = data.downloadUrl;
      } else {
        alert("Error");
      }
    }
    getLink();
  </script>
</body>
</html>
